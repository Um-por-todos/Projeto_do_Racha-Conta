<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Novo pagamento')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><div class="card"><h1>Novo pagamento</h1><form method="post" action="/pagamentos"><label>Dívida</label><select name="dividaId" required><option th:each="d:${dividas}" th:value="${d.id}" th:text="${'R$ '+d.valor+' - devedor ID '+d.devedorId+' para credor ID '+d.credorId}"></option></select><label>Valor pago</label><input name="valorPago" type="number" step="0.01" required><label>Data</label><input name="dataPagamento" type="date"><label><input type="checkbox" name="confirmado" value="true"> Confirmar agora</label><button class="btn">Salvar</button></form></div></body></html>
