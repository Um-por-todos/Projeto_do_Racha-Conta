<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Despesas')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><h1>Despesas</h1><p><a class="btn" href="/despesas/novo">Nova despesa</a></p><table><tr><th>Descrição</th><th>Valor</th><th>Tipo</th><th>Pagador</th><th>Data</th><th>Ações</th></tr><tr th:each="d:${despesas}"><td th:text="${d.descricao}"></td><td th:text="${d.valorTotal}"></td><td th:text="${d.tipo}"></td><td th:text="${d.pagadorId}"></td><td th:text="${d.data}"></td><td><a th:href="@{/despesas/{id}(id=${d.id})}">Detalhes</a> | <a th:href="@{/despesas/{id}/editar(id=${d.id})}">Editar</a><form style="display:inline" method="post" th:action="@{/despesas/{id}/excluir(id=${d.id})}"><button class="danger">Excluir</button></form></td></tr></table></body></html>
