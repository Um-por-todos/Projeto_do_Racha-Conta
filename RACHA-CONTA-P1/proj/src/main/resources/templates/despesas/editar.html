<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Editar despesa')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><div class="card"><h1>Editar despesa</h1><form method="post" th:action="@{/despesas/{id}(id=${despesa.id})}"><label>Valor total</label><input name="valorTotal" type="number" step="0.01" th:value="${despesa.valorTotal}" required><label>Descrição</label><input name="descricao" th:value="${despesa.descricao}" required><label>Tipo</label><input name="tipo" th:value="${despesa.tipo}" required><label>Casa</label><select name="casaId" required><option th:each="c:${casas}" th:value="${c.id}" th:text="${c.nome}" th:selected="${c.id==despesa.casaId}"></option></select><label>Pagador</label><select name="pagadorId" required><option th:each="m:${moradores}" th:value="${m.id}" th:text="${m.nome}" th:selected="${m.id==despesa.pagadorId}"></option></select><label>Data</label><input name="data" type="date" th:value="${despesa.data}"><button class="btn">Salvar</button></form></div></body></html>
