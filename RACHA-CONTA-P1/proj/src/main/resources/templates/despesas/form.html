<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Nova despesa')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><div class="card"><h1>Nova despesa</h1><p class="muted">Ao salvar, o sistema calcula a parcela individual e gera as dívidas automaticamente.</p><form method="post" action="/despesas"><label>Valor total</label><input name="valorTotal" type="number" step="0.01" min="0.01" required><label>Descrição</label><input name="descricao" required><label>Tipo</label><input name="tipo" required><label>Casa</label><select name="casaId" required><option th:each="c:${casas}" th:value="${c.id}" th:text="${c.nome}"></option></select><label>Quem pagou</label><select name="pagadorId" required><option th:each="m:${moradores}" th:value="${m.id}" th:text="${m.nome}"></option></select><label>Data</label><input name="data" type="date"><button class="btn">Registrar despesa</button></form></div></body></html>
