<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Balanço financeiro')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><h1>Relatório Financeiro</h1><div class="card"><h2>Saldo total pendente</h2><strong th:text="${relatorio.saldoTotal}"></strong></div><div class="card"><h2>Quem deve para quem</h2><table><tr><th>Devedor</th><th>Credor</th><th>Valor</th><th>Status</th></tr><tr th:each="d:${dividas}"><td th:text="${nome.apply(d.devedorId)}"></td><td th:text="${nome.apply(d.credorId)}"></td><td th:text="${d.valor}"></td><td th:text="${d.verificarStatus()}"></td></tr></table></div></body></html>
