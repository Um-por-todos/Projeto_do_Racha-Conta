<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Administradores')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><h1>Administradores da casa</h1><p><a class="btn" href="/administradores/novo">Novo administrador</a></p><table><tr><th>Nome</th><th>E-mail</th><th>Nível</th><th>Ações</th></tr><tr th:each="a:${administradores}"><td th:text="${a.nome}"></td><td th:text="${a.email}"></td><td th:text="${a.nivelAcesso}"></td><td><a th:href="@{/administradores/{id}/editar(id=${a.id})}">Editar</a><form style="display:inline" method="post" th:action="@{/administradores/{id}/excluir(id=${a.id})}"><button class="danger">Excluir</button></form></td></tr></table></body></html>
