<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Casas')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><h1>Casas</h1><p><a class="btn" href="/casa/novo">Nova casa</a></p><table><tr><th>Nome</th><th>Endereço</th><th>Ações</th></tr><tr th:each="c:${casas}"><td th:text="${c.nome}"></td><td th:text="${c.endereco}"></td><td><a th:href="@{/casa/{id}(id=${c.id})}">Detalhes</a> | <a th:href="@{/casa/{id}/editar(id=${c.id})}">Editar</a> <form style="display:inline" method="post" th:action="@{/casa/{id}/excluir(id=${c.id})}"><button class="danger">Excluir</button></form></td></tr></table></body></html>
