<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Editar morador')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><div class="card"><h1>Editar morador</h1><form method="post" th:action="@{/moradores/{id}(id=${morador.id})}"><label>Nome</label><input name="nome" th:value="${morador.nome}" required><label>E-mail</label><input name="email" th:value="${morador.email}" required><label>Casa</label><select name="casaId"><option value="">Sem casa</option><option th:each="c:${casas}" th:value="${c.id}" th:text="${c.nome}"></option></select><label><input type="checkbox" name="ativo" value="true" th:checked="${morador.ativo}"> Ativo</label><button class="btn">Salvar</button></form></div></body></html>
