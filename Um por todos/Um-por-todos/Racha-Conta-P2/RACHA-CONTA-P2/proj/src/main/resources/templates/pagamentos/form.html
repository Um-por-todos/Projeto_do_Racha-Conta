<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Novo pagamento')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="card">
    <h1>Novo pagamento</h1>
    <form method="post" th:action="@{/pagamentos}" th:object="${pagamentoDTO}">
        <label>Dívida</label>
        <select th:field="*{dividaId}">
            <option value="">Selecione</option>
            <option th:each="d : ${dividas}"
                    th:value="${d.id}"
                    th:text="${'R$ ' + d.valor + ' - devedor ID ' + d.devedorId + ' para credor ID ' + d.credorId}">
            </option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('dividaId')}" th:errors="*{dividaId}"></p>

        <label>Valor pago</label>
        <input th:field="*{valorPago}" type="number" step="0.01" min="0.01">
        <p class="field-error" th:if="${#fields.hasErrors('valorPago')}" th:errors="*{valorPago}"></p>

        <label>Data</label>
        <input th:field="*{dataPagamento}" type="date">

        <label><input type="checkbox" th:field="*{confirmado}"> Confirmar agora</label>
        <button class="btn">Salvar</button>
    </form>
</div>
</body>
</html>
