<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Operação não permitida')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="card error-card">
    <p class="error-code" th:text="${codigo}">400</p>
    <h1 th:text="${titulo}">Não foi possível concluir a operação</h1>
    <p class="alert" th:text="${mensagem}">Verifique os dados informados.</p>
    <a class="btn" href="javascript:history.back()">Voltar</a>
    <a class="btn" href="/home">Ir para o início</a>
</div>
</body>
</html>
