<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Moradores')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><h1>Moradores</h1><p><a class="btn" href="/moradores/novo">Novo morador</a></p><table><tr><th>Nome</th><th>E-mail</th><th>Ativo</th><th>Ações</th></tr><tr th:each="m:${moradores}"><td th:text="${m.nome}"></td><td th:text="${m.email}"></td><td th:text="${m.ativo?'Sim':'Não'}"></td><td><a th:href="@{/moradores/{id}(id=${m.id})}">Detalhes</a> | <a th:href="@{/moradores/{id}/editar(id=${m.id})}">Editar</a> <form style="display:inline" method="post" th:action="@{/moradores/{id}/excluir(id=${m.id})}"><button class="danger" type="submit">Excluir</button></form></td></tr></table></body></html>
