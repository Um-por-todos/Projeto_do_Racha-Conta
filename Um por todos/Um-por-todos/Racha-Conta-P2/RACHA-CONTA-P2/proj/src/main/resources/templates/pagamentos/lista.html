<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Pagamentos')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><h1>Pagamentos</h1><p><a class="btn" href="/pagamentos/novo">Registrar pagamento</a></p><table><tr><th>Valor pago</th><th>Data</th><th>Dívida</th><th>Confirmado</th><th>Ação</th></tr><tr th:each="p:${pagamentos}"><td th:text="${p.valorPago}"></td><td th:text="${p.dataPagamento}"></td><td th:text="${p.dividaId}"></td><td th:text="${p.confirmado?'Sim':'Não'}"></td><td><form th:if="${!p.confirmado}" method="post" th:action="@{/pagamentos/{id}/confirmar(id=${p.id})}"><button class="btn">Confirmar</button></form></td></tr></table></body></html>
