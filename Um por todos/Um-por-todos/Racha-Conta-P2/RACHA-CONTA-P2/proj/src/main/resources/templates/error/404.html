<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Recurso não encontrado')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="card error-card">
    <p class="error-code" th:text="${codigo}">404</p>
    <h1 th:text="${titulo}">Recurso não encontrado</h1>
    <p class="alert" th:text="${mensagem}">O recurso solicitado não foi localizado.</p>
    <a class="btn" href="/home">Ir para o início</a>
</div>
</body>
</html>
