<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Dívidas')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><h1>Dívidas</h1><table><tr><th>Devedor</th><th>Credor</th><th>Valor</th><th>Status</th><th>Ações</th></tr><tr th:each="d:${dividas}"><td th:text="${nome.apply(d.devedorId)}"></td><td th:text="${nome.apply(d.credorId)}"></td><td th:text="${d.valor}"></td><td th:text="${d.verificarStatus()}"></td><td><form th:if="${!d.quitada}" method="post" th:action="@{/dividas/{id}/pagar(id=${d.id})}"><button class="btn">Marcar como paga</button></form></td></tr></table></body></html>
